[package]
name = "rustcraft"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Offline launcher for Horizon, the Minecraft Java Edition rewrite in Rust"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
dirs = "7.0.0"
eframe = "0.32.3"
flate2 = "1.1.11"
hex = "0.4.3"
image = { version = "0.25.9", default-features = false, features = ["png"] }
md-5 = "0.11.0"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
sha2 = "0.11.1"
tar = "0.4.46"
thiserror = "2.0.21"
zip = { version = "9.4.2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3.27.0"
